<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armani Cryptic</title>
<style>
  :root { --bg:#fafaf7; --fg:#1a1a1a; --muted:#777; --accent:#2f6fde; --ok:#2e9e5b; --box:#fff; --line:#ccc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#999; --accent:#6a9cff; --ok:#4cc27c; --box:#1f1f1f; --line:#444; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, sans-serif; display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:440px; text-align:center; }
  h1 { font-family: Georgia, serif; font-size:28px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  .clue { font-family: Georgia, serif; font-size:22px; line-height:1.4; margin-bottom:24px; }
  .clue mark { background:none; color:inherit; padding:0; }
  .clue mark.ind { text-decoration: underline wavy var(--accent); }
  .clue mark.fod { text-decoration: underline solid var(--ok); text-underline-offset:4px; }
  .boxes { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
  .boxes input { width:52px; height:60px; font-size:28px; text-align:center; text-transform:uppercase; border:2px solid var(--line); border-radius:6px; background:var(--box); color:var(--fg); font-weight:600; }
  .boxes input:focus { outline:none; border-color:var(--accent); }
  .boxes input.given { color:var(--accent); }
  .boxes.solved input { border-color:var(--ok); color:var(--ok); }
  .boxes.wrong { animation: shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  button { font:inherit; font-size:14px; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--box); color:var(--fg); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .timer { color:var(--muted); font-variant-numeric: tabular-nums; margin-bottom:16px; }
  .msg { min-height:22px; font-size:15px; margin:8px 0; }
  #done { display:none; }
</style>
</head>
<body>
<main>
  <h1>Armani Cryptic</h1>
  <div class="sub">#1 · one clue, as fast as you can</div>
  <div class="timer" id="timer">0:00</div>
  <div class="clue">Chris gets <mark id="ind">news of</mark> <mark id="fod">change, how unfortunate Devon</mark> (4)</div>
  <div class="boxes" id="boxes"></div>
  <div class="row" id="hints">
    <button id="hInd">Indicator</button>
    <button id="hFod">Fodder</button>
    <button id="hLet">Letter</button>
  </div>
  <div class="row"><button class="primary" id="check">Check</button></div>
  <div class="msg" id="msg"></div>
  <div id="done"><button class="primary" id="share">Share</button></div>
</main>
<script>
  const ANSWER = "CHUD";
  const boxesEl = document.getElementById("boxes");
  const inputs = [];
  const used = { ind:false, fod:false, let:0 };
  const start = Date.now();
  let solvedAt = null;

  for (let i = 0; i < ANSWER.length; i++) {
    const inp = document.createElement("input");
    inp.maxLength = 1; inp.autocomplete = "off"; inp.autocapitalize = "characters";
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/[^a-z]/gi, "").slice(-1).toUpperCase();
      if (inp.value) focusNext(i);
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) { inputs[i-1].focus(); }
      if (e.key === "Enter") check();
    });
    boxesEl.appendChild(inp); inputs.push(inp);
  }
  inputs[0].focus();

  function focusNext(i) {
    for (let j = i + 1; j < inputs.length; j++) if (!inputs[j].readOnly) { inputs[j].focus(); return; }
  }
  const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const tick = setInterval(() => { document.getElementById("timer").textContent = fmt(Date.now() - start); }, 250);
  const msg = t => document.getElementById("msg").textContent = t;

  document.getElementById("hInd").onclick = e => {
    used.ind = true; e.target.disabled = true;
    document.getElementById("ind").className = "ind";
    msg("Indicator: \"news of\" → take the first letters (heads)");
  };
  document.getElementById("hFod").onclick = e => {
    used.fod = true; e.target.disabled = true;
    document.getElementById("fod").className = "fod";
    msg("Fodder: \"change, how unfortunate Devon\"");
  };
  document.getElementById("hLet").onclick = e => {
    const i = inputs.findIndex(x => !x.readOnly);
    if (i < 0) return;
    used.let++;
    inputs[i].value = ANSWER[i]; inputs[i].readOnly = true; inputs[i].classList.add("given");
    if (inputs.every(x => x.readOnly)) { e.target.disabled = true; check(); }
  };

  function check() {
    if (solvedAt) return;
    const guess = inputs.map(x => x.value).join("");
    if (guess.length < ANSWER.length) { msg("Fill in all " + ANSWER.length + " letters"); return; }
    if (guess === ANSWER) {
      solvedAt = Date.now() - start; clearInterval(tick);
      document.getElementById("timer").textContent = fmt(solvedAt);
      boxesEl.classList.add("solved");
      inputs.forEach(x => x.readOnly = true);
      document.querySelectorAll("#hints button, #check").forEach(b => b.disabled = true);
      msg("Solved! Definition: \"Chris\"");
      document.getElementById("done").style.display = "block";
    } else {
      msg("Not quite");
      boxesEl.classList.remove("wrong"); void boxesEl.offsetWidth; boxesEl.classList.add("wrong");
    }
  }
  document.getElementById("check").onclick = check;

  document.getElementById("share").onclick = async () => {
    const hintCount = (used.ind ? 1 : 0) + (used.fod ? 1 : 0) + used.let;
    const hintRow = (used.ind ? "🟨" : "⬜") + (used.fod ? "🟧" : "⬜") + "🟥".repeat(used.let) + "⬜".repeat(ANSWER.length - used.let);
    const text = "Armani Cryptic #1\n⏱️ " + fmt(solvedAt) + "\n💡 " + (hintCount === 0 ? "No hints! 🏆" : hintCount + " hint" + (hintCount > 1 ? "s" : "")) + "\n" + hintRow + "\n" + location.href;
    try {
      if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); msg("Copied to clipboard!"); }
    } catch (_) { msg(text); }
  };
</script>
</body>
</html>
